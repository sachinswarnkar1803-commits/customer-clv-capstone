version: "3.8"

services:
  customer-clv-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bds34-clv-platform
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
