name: BDS-34 CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src dashboard scripts tests

      - name: Run tests
        run: pytest -q

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Static security scan
        run: bandit -q -r src dashboard scripts -x tests

      - name: Performance evidence smoke check
        run: |
          if [ -f data/processed/customer_clv_segments.parquet ]; then
            python scripts/performance_check.py --rows 1000
          else
            echo "No generated analytical artifacts in CI checkout; performance benchmark is executed after pipeline generation."
          fi
